spring:
  application:
    name: easy-ql
  datasource:
    url: jdbc:postgresql://localhost:5435/warehouse_db
    username: easyql
    password: easyql
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: warehouse-pool
  flyway:
    enabled: true
    locations: classpath:db/warehouse
    schemas: public
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8090}   # default 8090 to avoid common 8080 conflicts on dev laptops; override via env var when needed

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.soumyajit.easyql: DEBUG
    org.springframework.web: INFO
